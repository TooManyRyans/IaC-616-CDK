AWSTemplateFormatVersion: '2010-09-09'
Description: Server stack with 2 EC2 web servers, MySQL RDS in private subnets, and an ALB.

Parameters:
  NetworkStackName:
    Type: String
    Default: network-stack
    Description: Exact name of the deployed Network Stack to import values from.

  LatestAmiId:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64
    Description: Automatically fetches the latest Amazon Linux 2023 AMI (supports dnf).

  DBUsername:
    Type: String
    Default: admin
    Description: Master username for the MySQL RDS instance.

  DBPassword:
    Type: String
    NoEcho: true
    MinLength: 8
    Description: Master password for the MySQL RDS instance (at least 8 characters).

Resources:
  # 1. IAM Role so EC2 instances can run 'aws s3 cp'
  WebServerRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonS3ReadOnlyAccess

  WebServerInstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles:
        - !Ref WebServerRole

  # 2. Security Groups
  WebServerSG:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Allow HTTP (port 80) from anywhere
      VpcId:
        Fn::ImportValue: !Sub "${NetworkStackName}-VPCID"
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0

  RDSSG:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Allow MySQL (port 3306) only from WebServerSG
      VpcId:
        Fn::ImportValue: !Sub "${NetworkStackName}-VPCID"
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 3306
          ToPort: 3306
          SourceSecurityGroupId: !Ref WebServerSG

  # 3. EC2 Web Servers (one in each public subnet)
  WebServer1:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: !Ref LatestAmiId
      InstanceType: t3.micro
      IamInstanceProfile: !Ref WebServerInstanceProfile
      SubnetId:
        Fn::ImportValue: !Sub "${NetworkStackName}-PublicSubnet1"
      SecurityGroupIds:
        - !Ref WebServerSG
      Tags:
        - Key: Name
          Value: WebServer1
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          dnf update -y
          dnf install -y git httpd php
          service httpd start
          chkconfig httpd on
          aws s3 cp s3://seis665-public/index.php /var/www/html/

  WebServer2:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: !Ref LatestAmiId
      InstanceType: t3.micro
      IamInstanceProfile: !Ref WebServerInstanceProfile
      SubnetId:
        Fn::ImportValue: !Sub "${NetworkStackName}-PublicSubnet2"
      SecurityGroupIds:
        - !Ref WebServerSG
      Tags:
        - Key: Name
          Value: WebServer2
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          dnf update -y
          dnf install -y git httpd php
          service httpd start
          chkconfig httpd on
          aws s3 cp s3://seis665-public/index.php /var/www/html/

  # 4. RDS Subnet Group & MySQL Instance
  DBSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupDescription: Private subnets for RDS MySQL instance
      SubnetIds:
        - Fn::ImportValue: !Sub "${NetworkStackName}-PrivateSubnet1"
        - Fn::ImportValue: !Sub "${NetworkStackName}-PrivateSubnet2"

  MySQLDatabase:
    Type: AWS::RDS::DBInstance
    Properties:
      DBInstanceIdentifier: !Sub "${AWS::StackName}-mysql-db"
      Engine: mysql
      DBInstanceClass: db.t3.micro
      AllocatedStorage: '20'
      MasterUsername: !Ref DBUsername
      MasterUserPassword: !Ref DBPassword
      DBSubnetGroupName: !Ref DBSubnetGroup
      VPCSecurityGroups:
        - !Ref RDSSG
      PubliclyAccessible: false

  # 5. Application Load Balancer, Target Group, and Listener
  WebLoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Scheme: internet-facing
      Type: application
      SecurityGroups:
        - !Ref WebServerSG
      Subnets:
        - Fn::ImportValue: !Sub "${NetworkStackName}-PublicSubnet1"
        - Fn::ImportValue: !Sub "${NetworkStackName}-PublicSubnet2"

  WebTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Port: 80
      Protocol: HTTP
      VpcId:
        Fn::ImportValue: !Sub "${NetworkStackName}-VPCID"
      HealthCheckPath: /index.php
      Targets:
        - Id: !Ref WebServer1
        - Id: !Ref WebServer2

  WebListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref WebLoadBalancer
      Port: 80
      Protocol: HTTP
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref WebTargetGroup

Outputs:
  WebsiteURL:
    Description: Application Load Balancer URL
    Value: !Sub "http://${WebLoadBalancer.DNSName}"

  RDSEndpoint:
    Description: MySQL Database Endpoint
    Value: !GetAtt MySQLDatabase.Endpoint.Address